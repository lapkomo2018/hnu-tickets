name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.x"
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Check generated OpenAPI specification
        run: |
          go tool swag init -g cmd/api/main.go -o docs --parseInternal
          git diff --exit-code docs
      - name: Test
        run: go test ./...
      - name: Build
        run: go build ./...
