openapi: 3.1.0
info:
  title: HNU Tickets API
  version: 1.0.0
  description: Technical support ticket management API.
servers:
  - url: http://localhost:8080/api/v1
tags:
  - name: Auth
  - name: Users
  - name: Categories
  - name: Tickets
  - name: Comments
  - name: History
  - name: Analytics
paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a user account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterRequest'}
      responses:
        '201': {description: Registered, content: {application/json: {schema: {$ref: '#/components/schemas/Session'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
  /auth/login:
    post:
      tags: [Auth]
      summary: Create an access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200': {description: Authenticated, content: {application/json: {schema: {$ref: '#/components/schemas/Session'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /auth/me:
    get:
      tags: [Auth]
      summary: Get the authenticated user
      responses:
        '200': {description: Current user, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /users:
    get:
      tags: [Users]
      summary: List users
      description: ADMIN only.
      responses:
        '200': {description: Users, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/User'}}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
  /users/{id}:
    parameters:
      - {$ref: '#/components/parameters/ID'}
    get:
      tags: [Users]
      summary: Get a user
      description: ADMIN only.
      responses:
        '200': {description: User, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [Users]
      summary: Update a user
      description: ADMIN only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string, minLength: 2, maxLength: 100}
                email: {type: string, format: email}
      responses:
        '200': {description: Updated user, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
  /users/{id}/role:
    parameters:
      - {$ref: '#/components/parameters/ID'}
    patch:
      tags: [Users]
      summary: Change a user role
      description: ADMIN only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: {$ref: '#/components/schemas/Role'}
      responses:
        '204': {description: Role updated}
        '400': {$ref: '#/components/responses/BadRequest'}
  /categories:
    get:
      tags: [Categories]
      summary: List categories
      responses:
        '200': {description: Categories, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Category'}}}}}
    post:
      tags: [Categories]
      summary: Create a category
      description: ADMIN only.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CategoryInput'}
      responses:
        '201': {description: Created category, content: {application/json: {schema: {$ref: '#/components/schemas/Category'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
  /categories/{id}:
    parameters:
      - {$ref: '#/components/parameters/ID'}
    patch:
      tags: [Categories]
      summary: Update a category
      description: ADMIN only.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CategoryInput'}
      responses:
        '200': {description: Updated category, content: {application/json: {schema: {$ref: '#/components/schemas/Category'}}}}
    delete:
      tags: [Categories]
      summary: Delete an unused category
      description: ADMIN only.
      responses:
        '204': {description: Deleted}
        '409': {$ref: '#/components/responses/Conflict'}
  /tickets:
    get:
      tags: [Tickets]
      summary: List visible tickets
      parameters:
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: pageSize, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {name: q, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {$ref: '#/components/schemas/Status'}}
        - {name: priority, in: query, schema: {$ref: '#/components/schemas/Priority'}}
        - {name: categoryId, in: query, schema: {type: string, format: uuid}}
        - {name: assignedTo, in: query, schema: {type: string, format: uuid}}
        - {name: createdFrom, in: query, schema: {type: string, format: date-time}}
        - {name: createdTo, in: query, schema: {type: string, format: date-time}}
        - {name: sort, in: query, schema: {type: string, enum: [createdAt, updatedAt, priority, status]}}
        - {name: order, in: query, schema: {type: string, enum: [asc, desc]}}
      responses:
        '200': {description: Ticket page, content: {application/json: {schema: {$ref: '#/components/schemas/TicketPage'}}}}
    post:
      tags: [Tickets]
      summary: Create a ticket
      description: USER only.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateTicketRequest'}
      responses:
        '201': {description: Created ticket, content: {application/json: {schema: {$ref: '#/components/schemas/Ticket'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
  /tickets/{id}:
    parameters:
      - {$ref: '#/components/parameters/ID'}
    get:
      tags: [Tickets]
      summary: Get a visible ticket
      responses:
        '200': {description: Ticket, content: {application/json: {schema: {$ref: '#/components/schemas/Ticket'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
    patch:
      tags: [Tickets]
      summary: Update editable ticket fields
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateTicketRequest'}
      responses:
        '200': {description: Updated ticket, content: {application/json: {schema: {$ref: '#/components/schemas/Ticket'}}}}
  /tickets/{id}/assign:
    parameters:
      - {$ref: '#/components/parameters/ID'}
    patch:
      tags: [Tickets]
      summary: Assign or reassign a specialist
      description: ADMIN only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [specialistId]
              properties:
                specialistId: {type: string, format: uuid}
      responses:
        '200': {description: Assigned ticket, content: {application/json: {schema: {$ref: '#/components/schemas/Ticket'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
  /tickets/{id}/status:
    parameters:
      - {$ref: '#/components/parameters/ID'}
    patch:
      tags: [Tickets]
      summary: Change ticket status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: {$ref: '#/components/schemas/Status'}
      responses:
        '200': {description: Updated ticket, content: {application/json: {schema: {$ref: '#/components/schemas/Ticket'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
  /tickets/{id}/comments:
    parameters:
      - {$ref: '#/components/parameters/ID'}
    get:
      tags: [Comments]
      summary: List ticket comments
      responses:
        '200': {description: Comments, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Comment'}}}}}
    post:
      tags: [Comments]
      summary: Add a ticket comment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: {type: string, minLength: 1, maxLength: 5000}
      responses:
        '201': {description: Created comment, content: {application/json: {schema: {$ref: '#/components/schemas/Comment'}}}}
  /tickets/{id}/history:
    parameters:
      - {$ref: '#/components/parameters/ID'}
    get:
      tags: [History]
      summary: List immutable ticket history
      responses:
        '200': {description: History entries, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/HistoryEntry'}}}}}
  /analytics/overview:
    get:
      tags: [Analytics]
      summary: Get ticket overview
      description: ADMIN only.
      parameters:
        - {$ref: '#/components/parameters/From'}
        - {$ref: '#/components/parameters/To'}
      responses:
        '200': {description: Overview, content: {application/json: {schema: {$ref: '#/components/schemas/Overview'}}}}
  /analytics/statuses:
    get:
      tags: [Analytics]
      summary: Count tickets by status
      parameters: [{$ref: '#/components/parameters/From'}, {$ref: '#/components/parameters/To'}]
      responses:
        '200': {description: Counts, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Count'}}}}}
  /analytics/priorities:
    get:
      tags: [Analytics]
      summary: Count tickets by priority
      parameters: [{$ref: '#/components/parameters/From'}, {$ref: '#/components/parameters/To'}]
      responses:
        '200': {description: Counts, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Count'}}}}}
  /analytics/categories:
    get:
      tags: [Analytics]
      summary: Count tickets by category
      parameters: [{$ref: '#/components/parameters/From'}, {$ref: '#/components/parameters/To'}]
      responses:
        '200': {description: Counts, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/CategoryCount'}}}}}
  /analytics/specialists:
    get:
      tags: [Analytics]
      summary: Get open workload by specialist
      parameters: [{$ref: '#/components/parameters/From'}, {$ref: '#/components/parameters/To'}]
      responses:
        '200': {description: Workloads, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/SpecialistWorkload'}}}}}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    From:
      name: from
      in: query
      schema: {type: string, format: date-time}
    To:
      name: to
      in: query
      schema: {type: string, format: date-time}
  responses:
    BadRequest: {description: Invalid input, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Unauthorized: {description: Authentication required, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Forbidden: {description: Operation is forbidden, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    NotFound: {description: Resource not found, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Conflict: {description: State conflict, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  schemas:
    Role: {type: string, enum: [USER, SPECIALIST, ADMIN]}
    Status: {type: string, enum: [NEW, ASSIGNED, IN_PROGRESS, WAITING_FOR_USER, RESOLVED, CLOSED, CANCELLED]}
    Priority: {type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL]}
    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name: {type: string, minLength: 2, maxLength: 100}
        email: {type: string, format: email}
        password: {type: string, format: password, minLength: 8}
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: {type: string, format: email}
        password: {type: string, format: password}
    Session:
      type: object
      required: [accessToken, user]
      properties:
        accessToken: {type: string}
        user: {$ref: '#/components/schemas/User'}
    User:
      type: object
      required: [id, name, email, role, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        email: {type: string, format: email}
        role: {$ref: '#/components/schemas/Role'}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    UserSummary:
      type: object
      required: [id, name]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
    CategoryInput:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 2, maxLength: 100}
        description: {type: string}
    Category:
      allOf:
        - type: object
          required: [id]
          properties:
            id: {type: string, format: uuid}
        - {$ref: '#/components/schemas/CategoryInput'}
    CreateTicketRequest:
      type: object
      required: [title, description, categoryId, priority]
      properties:
        title: {type: string, minLength: 3, maxLength: 255}
        description: {type: string, minLength: 1}
        categoryId: {type: string, format: uuid}
        priority: {$ref: '#/components/schemas/Priority'}
    UpdateTicketRequest:
      type: object
      properties:
        title: {type: string, minLength: 3, maxLength: 255}
        description: {type: string, minLength: 1}
        categoryId: {type: string, format: uuid}
        priority: {$ref: '#/components/schemas/Priority'}
    Ticket:
      type: object
      required: [id, title, description, status, priority, category, createdBy, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        title: {type: string}
        description: {type: string}
        status: {$ref: '#/components/schemas/Status'}
        priority: {$ref: '#/components/schemas/Priority'}
        category: {$ref: '#/components/schemas/Category'}
        createdBy: {$ref: '#/components/schemas/UserSummary'}
        assignedTo: {anyOf: [{$ref: '#/components/schemas/UserSummary'}, {type: 'null'}]}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        resolvedAt: {type: [string, 'null'], format: date-time}
        closedAt: {type: [string, 'null'], format: date-time}
    TicketPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Ticket'}}
        page: {type: integer}
        pageSize: {type: integer}
        total: {type: integer, format: int64}
    Comment:
      type: object
      properties:
        id: {type: string, format: uuid}
        ticketId: {type: string, format: uuid}
        author: {$ref: '#/components/schemas/UserSummary'}
        content: {type: string}
        createdAt: {type: string, format: date-time}
    HistoryEntry:
      type: object
      properties:
        id: {type: string, format: uuid}
        ticketId: {type: string, format: uuid}
        changedBy: {type: string, format: uuid}
        action: {type: string}
        oldValue: {type: [string, 'null']}
        newValue: {type: [string, 'null']}
        createdAt: {type: string, format: date-time}
    Overview:
      type: object
      properties:
        totalTickets: {type: integer, format: int64}
        openTickets: {type: integer, format: int64}
        inProgressTickets: {type: integer, format: int64}
        resolvedTickets: {type: integer, format: int64}
        closedTickets: {type: integer, format: int64}
        averageResolutionSeconds: {type: number}
    Count:
      type: object
      properties:
        value: {type: string}
        count: {type: integer, format: int64}
    CategoryCount:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        count: {type: integer, format: int64}
    SpecialistWorkload:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        openTickets: {type: integer, format: int64}
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string}
            message: {type: string}
security:
  - bearerAuth: []
