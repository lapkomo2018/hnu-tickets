services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: tickets
      POSTGRES_USER: tickets
      POSTGRES_PASSWORD: tickets
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tickets -d tickets"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  migrate:
    image: migrate/migrate:v4.19.0
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    command: ["-path", "/migrations", "-database", "postgres://tickets:tickets@postgres:5432/tickets?sslmode=disable", "up"]

  api:
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV: development
      APP_PORT: 8080
      DATABASE_URL: postgres://tickets:tickets@postgres:5432/tickets?sslmode=disable
      JWT_SECRET: development-secret-change-me
      JWT_TTL: 24h
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "8080:8080"

volumes:
  postgres_data:
